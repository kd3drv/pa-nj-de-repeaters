/* Linked repeater highlighting */

/* Idle state: no repeater selected -> faint, slow glow on every linked repeater */
.linked-repeater-marker {

    animation:
        linkedGlowIdle
        3s
        ease-in-out
        infinite;
}


/* Selected network: only members of the clicked repeater's network */
.linked-repeater-marker.linked-repeater-active {

    animation:
        linkedGlowStrong
        1.2s
        ease-in-out
        infinite;
}


/* A repeater is selected, but this linked repeater is NOT in its network */
.linked-repeater-marker.linked-repeater-off {

    animation: none;

    filter: none;
}


@keyframes linkedGlowIdle {

    0%, 100% {

        filter:
            drop-shadow(0 0 1px rgba(255, 212, 0, 0.35))
            drop-shadow(0 0 2px rgba(255, 212, 0, 0.25));

    }

    50% {

        filter:
            drop-shadow(0 0 1px rgba(255, 212, 0, 0.55))
            drop-shadow(0 0 4px rgba(255, 212, 0, 0.35));

    }

}


@keyframes linkedGlowStrong {

    0%, 100% {

        filter:
            drop-shadow(0 0 3px #ffd400)
            drop-shadow(0 0 7px #ffd400)
            drop-shadow(0 0 12px #ffd400);

    50% {

            drop-shadow(0 0 6px #ffd400)
            drop-shadow(0 0 13px #ffd400)

<script>


// ==========================================================
// GLOBAL STATE
// ==========================================================

var searchMarker = null;

var radiusCircle = null;

var searchLocationState = null;

var bandColors = {
    "2m": "blue",
    "70cm": "green",
    "GMRS": "red"
};

var repeaterData = [];

var markerLayers = [];

var selectedLinkedCallSign = null;

var selectedMarker = null;

var markerSpreadByIndex = [];


// ==========================================================
// LOAD REPEATER JSON
// ==========================================================

fetch("repeaters.json")

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load repeater data"
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            repeaterData = data;

            initMarkers();

        }
    )

    .catch(
        error => {

            console.error(
                "Error fetching JSON:",
                error
            );

        }
    );


// ==========================================================
// INITIALIZE MARKERS
// ==========================================================

function initMarkers() {

    // Remove any existing markers
    markerLayers.forEach(
        function(item) {

            if (
                map_c183b44bf7d14c48b298286fea1dd962.hasLayer(
                    item.marker
                )
            ) {

                map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
                    item.marker
                );

            }

        }
    );


    markerLayers = [];


    repeaterData.forEach(
        function(repeater) {

            var color =
                bandColors[
                    repeater.band
                ] || "gray";


            var iconUrl =
                "https://raw.githubusercontent.com/"
                +
                "pointhi/leaflet-color-markers/"
                +
                "master/img/marker-icon-2x-"
                +
                color
                +
                ".png";


            var markerClass =
                repeater.linkedRepeater
                    ? "linked-repeater-marker"
                    : "";


            var icon = L.divIcon({

                className:
                    markerClass,

                html:
                    '<img src="'
                    +
                    iconUrl
                    +
                    '" style="width:19px;height:31px;">',

                iconSize:
                    [19, 31],

                iconAnchor:
                    [9, 31],

                popupAnchor:
                    [1, -26]

            });


            var marker =
                L.marker(
                    [
                        repeater.lat,
                        repeater.lon
                    ],
                    {
                        icon: icon
                    }
                );


            marker.bindPopup(
                L.popup(
                    {
                        maxWidth: 250,
                        maxHeight: Math.round(
                            window.innerHeight * 0.45
                        ),
                        autoPanPadding: [20, 60]
                    }
                ).setContent(
                    repeater.popup
                )
            );


            marker.on(
                "click",
                function() {

                    // Only linked repeaters trigger network highlighting.
                    // Clicking a non-linked repeater leaves the default glow.
                    if (
                        repeater.linkedRepeater
                        &&
                        repeater.callSign
                    ) {

                        selectedLinkedCallSign =
                            repeater.callSign;

                        selectedMarker =
                            marker;

                    } else {

                        selectedLinkedCallSign =
                            null;

                        selectedMarker =
                            null;

                    }

                    updateLinkedHighlight();

                    updateMarkerPositions();

                }
            );


            marker.addTo(
                map_c183b44bf7d14c48b298286fea1dd962
            );


            markerLayers.push({
                marker: marker,
                repeater: repeater
            });

        }
    );


    updateMarkers();

    updateMarkerPositions();

}


// ==========================================================
// UPDATE LINKED REPEATER HIGHLIGHT
// ==========================================================

function updateLinkedHighlight() {

    var hasSelection =
        selectedLinkedCallSign !== null;


    markerLayers.forEach(
        function(item) {

            var element =
                item.marker.getElement();

            if (!element) {
                return;
            }


            // Non-linked repeaters never glow
            if (!item.repeater.linkedRepeater) {

                element.classList.remove(
                    "linked-repeater-active",
                    "linked-repeater-off"
                );

                return;

            }


            if (!hasSelection) {

                // Nothing selected: faint idle glow on all linked repeaters
                element.classList.remove(
                    "linked-repeater-active",
                    "linked-repeater-off"
                );

            } else if (
                item.repeater.callSign ===
                    selectedLinkedCallSign
            ) {

                // Same network as the selected repeater: strong glow
                element.classList.add(
                    "linked-repeater-active"
                );

                element.classList.remove(
                    "linked-repeater-off"
                );

            } else {

                // Linked, but a different network: no glow
                element.classList.add(
                    "linked-repeater-off"
                );

                element.classList.remove(
                    "linked-repeater-active"
                );

            }

        }
    );


    updateSelectionChip();

}


// ==========================================================
// SELECTED NETWORK CHIP
// (selection now stays after the info card is closed)
// ==========================================================

var selectionChip = document.createElement("div");

selectionChip.id = "networkChip";

selectionChip.innerHTML =
    '<span id="networkChipText"></span>'
    +
    '<button type="button" id="networkFitBtn">Fit</button>'
    +
    '<button type="button" id="networkClearBtn" '
    +
    'aria-label="Clear selection">&#10005;</button>';

document.body.appendChild(selectionChip);

L.DomEvent.disableClickPropagation(selectionChip);


function getNetworkLatLngs(callSign) {

    return repeaterData
        .filter(
            function(r) {
                return r.linkedRepeater
                    && r.callSign === callSign;
            }
        )
        .map(
            function(r) {
                return [r.lat, r.lon];
            }
        );

}


function clearNetworkSelection() {

    selectedLinkedCallSign = null;

    selectedMarker = null;

    updateLinkedHighlight();

}


function updateSelectionChip() {

    if (selectedLinkedCallSign === null) {

        selectionChip.classList.remove("show");

        return;

    }

    var count =
        getNetworkLatLngs(
            selectedLinkedCallSign
        ).length;

    document.getElementById(
        "networkChipText"
    ).textContent =
        selectedLinkedCallSign
        +
        " network ("
        +
        count
        +
        " sites)";

    selectionChip.classList.add("show");

}


document.getElementById(
    "networkFitBtn"
).addEventListener(
    "click",
    function() {

        if (selectedLinkedCallSign === null) {
            return;
        }

        var points =
            getNetworkLatLngs(
                selectedLinkedCallSign
            );

        if (points.length === 0) {
            return;
        }

        // Close the info card so the whole network is visible
        map_c183b44bf7d14c48b298286fea1dd962.closePopup();

        map_c183b44bf7d14c48b298286fea1dd962.fitBounds(
            L.latLngBounds(points),
            {
                padding: [50, 50],
                maxZoom: 12
            }
        );

    }
);


document.getElementById(
    "networkClearBtn"
).addEventListener(
    "click",
    clearNetworkSelection
);


// ==========================================================
// SPREAD CO-LOCATED MARKERS
// ==========================================================

function setMarkerPosition(marker, lat, lon) {

    // Only touch the marker if its position really changes.
    // (Avoids needless popup re-layout / auto-pan loops.)
    var current = marker.getLatLng();

    if (
        Math.abs(current.lat - lat) < 1e-9
        &&
        Math.abs(current.lng - lon) < 1e-9
    ) {
        return;
    }

    marker.setLatLng([lat, lon]);

}


function updateMarkerPositions() {

    var zoom =
        map_c183b44bf7d14c48b298286fea1dd962.getZoom();

    var spreadFactor =
        Math.max(
            0,
            Math.min(
                1,
                (zoom - 6) / 3
            )
        );


    // Group visible markers that share exact coordinates
    var groups = {};

    markerLayers.forEach(
        function(item, index) {

            if (
                !map_c183b44bf7d14c48b298286fea1dd962.hasLayer(
                    item.marker
                )
            ) {
                return;
            }

            var key =
                item.repeater.lat.toFixed(7)
                +
                ","
                +
                item.repeater.lon.toFixed(7);

            if (!groups[key]) {
                groups[key] = [];
            }

            groups[key].push(index);

        }
    );


    // Start every marker at its true position...
    var targets = markerLayers.map(
        function(item) {
            return [
                item.repeater.lat,
                item.repeater.lon
            ];
        }
    );


    // ...then fan out stacked groups in a ring
    if (spreadFactor > 0) {

        Object.keys(groups).forEach(
            function(key) {

                var indexes = groups[key];

                var count = indexes.length;

                if (count <= 1) {
                    return;
                }

                // Ring grows with the number of pins so a big
                // stack never collapses into one blob
                var radius =
                    Math.max(
                        26,
                        (count * 22) / (2 * Math.PI)
                    )
                    *
                    spreadFactor;

                indexes.forEach(
                    function(markerIndex, position) {

                        var item =
                            markerLayers[markerIndex];

                        var angle =
                            (
                                2 * Math.PI *
                                position / count
                            )
                            -
                            Math.PI / 2;

                        var point =
                            map_c183b44bf7d14c48b298286fea1dd962.latLngToLayerPoint(
                                L.latLng(
                                    item.repeater.lat,
                                    item.repeater.lon
                                )
                            );

                        point.x += Math.cos(angle) * radius;
                        point.y += Math.sin(angle) * radius;

                        var offset =
                            map_c183b44bf7d14c48b298286fea1dd962.layerPointToLatLng(
                                point
                            );

                        targets[markerIndex] = [
                            offset.lat,
                            offset.lng
                        ];

                    }
                );

            }
        );

    }


    markerLayers.forEach(
        function(item, index) {

            setMarkerPosition(
                item.marker,
                targets[index][0],
                targets[index][1]
            );

        }
    );

}


// ==========================================================
// TOGGLE FILTER PANEL
// ==========================================================

function toggleFilterPanel() {

    var panel =
        document.getElementById(
            "filterPanel"
        );

    var button =
        document.getElementById(
            "filterButton"
        );


    if (
        panel.style.display === "none"
    ) {

        panel.style.display =
            "block";

        button.innerHTML =
            "🔎 Hide Filters";

    } else {

        panel.style.display =
            "none";

        button.innerHTML =
            "🔎 Find / Filter";

    }

}


// ==========================================================
// GET SELECTED BANDS
// ==========================================================

function getSelectedBands() {

    var checkboxes =
        document.querySelectorAll(
            ".bandCheckbox"
        );

    var selected = [];


    checkboxes.forEach(
        function(checkbox) {

            if (
                checkbox.checked
            ) {

                selected.push(
                    checkbox.value
                );

            }

        }
    );


    return selected;

}


// ==========================================================
// ALL BAND CHECKBOX
// ==========================================================

function toggleAllBands() {

    var allCheckbox =
        document.getElementById(
            "allBand"
        );

    var checkboxes =
        document.querySelectorAll(
            ".bandCheckbox"
        );


    checkboxes.forEach(
        function(checkbox) {

            checkbox.checked =
                allCheckbox.checked;

        }
    );


    updateMarkers();

}


// ==========================================================
// INDIVIDUAL BAND CHECKBOXES
// ==========================================================

function updateBandState() {

    var checkboxes =
        document.querySelectorAll(
            ".bandCheckbox"
        );

    var allCheckbox =
        document.getElementById(
            "allBand"
        );

    var allChecked = true;


    checkboxes.forEach(
        function(checkbox) {

            if (
                !checkbox.checked
            ) {

                allChecked = false;

            }

        }
    );


    allCheckbox.checked =
        allChecked;


    updateMarkers();

}


// ==========================================================
// DISTANCE CALCULATION
// ==========================================================

function distanceMiles(
    lat1,
    lon1,
    lat2,
    lon2
) {

    var R = 3958.8;


    var dLat =
        (lat2 - lat1)
        *
        Math.PI
        /
        180;


    var dLon =
        (lon2 - lon1)
        *
        Math.PI
        /
        180;


    var a =
        Math.sin(dLat / 2)
        *
        Math.sin(dLat / 2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLon / 2)
        *
        Math.sin(dLon / 2);


    var c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


// ==========================================================
// UPDATE MARKERS
//
// IMPORTANT:
// Matching markers are ADDED to the map.
// Nonmatching markers are REMOVED from the map.
//
// This replaces the old opacity-based filtering.
// ==========================================================

function updateMarkers() {

    var selectedBands =
        getSelectedBands();


    var radius =
        parseFloat(
            document.getElementById(
                "radiusSelect"
            ).value
        );


    var freqQuery =
        document.getElementById(
            "frequencyInput"
        ).value
        .trim();


    markerLayers.forEach(
        function(item) {

            var visible = true;


            // ----------------------------------------------
            // BAND FILTER
            // ----------------------------------------------

            if (
                !selectedBands.includes(
                    item.repeater.band
                )
            ) {

                visible = false;

            }


            // ----------------------------------------------
            // FREQUENCY FILTER
            // ----------------------------------------------

            if (
                visible
                &&
                freqQuery !== ""
            ) {

                var repeaterFreq =
                    String(
                        item.repeater.frequency
                        ||
                        ""
                    ).trim();


                if (
                    !repeaterFreq.startsWith(
                        freqQuery
                    )
                ) {

                    visible = false;

                }

            }


            // ----------------------------------------------
            // ECHOLINK FILTER
            // ----------------------------------------------

            var echoLinkFilter =
                document.getElementById(
                    "echoLinkSelect"
                ).value;


            if (
                visible
                &&
                echoLinkFilter === "yes"
                &&
                !item.repeater.echoLink
            ) {

                visible = false;

            }


            if (
                visible
                &&
                echoLinkFilter === "no"
                &&
                item.repeater.echoLink
            ) {

                visible = false;

            }


            // ----------------------------------------------
            // LOCATION / RADIUS FILTER
            // ----------------------------------------------

            if (
                visible
                &&
                searchLocationState !== null
            ) {

                var distance =
                    distanceMiles(
                        searchLocationState.lat,
                        searchLocationState.lon,
                        item.repeater.lat,
                        item.repeater.lon
                    );


                if (
                    distance > radius
                ) {

                    visible = false;

                }

            }


            // ----------------------------------------------
            // ACTUALLY ADD / REMOVE MARKER
            // ----------------------------------------------

            if (visible) {

                if (
                    !map_c183b44bf7d14c48b298286fea1dd962.hasLayer(
                        item.marker
                    )
                ) {

                    item.marker.addTo(
                        map_c183b44bf7d14c48b298286fea1dd962
                    );

                }

            } else {

                if (
                    map_c183b44bf7d14c48b298286fea1dd962.hasLayer(
                        item.marker
                    )
                ) {

                    map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
                        item.marker
                    );

                }

            }

        }
    );


    updateMarkerPositions();

    updateLinkedHighlight();

}


// ==========================================================
// SEARCH LOCATION
// ==========================================================

function searchLocation() {

    var query =
        document.getElementById(
            "locationInput"
        ).value.trim();


    if (!query) {

        alert(
            "Enter a location name first."
        );

        return;

    }


    var url =
        "https://nominatim.openstreetmap.org/search"
        +
        "?format=json"
        +
        "&limit=1"
        +
        "&q="
        +
        encodeURIComponent(
            query
        );


    fetch(
        url,
        {
            headers: {
                "Accept":
                    "application/json"
            }
        }
    )

    .then(
        response =>
            response.json()
    )

    .then(
        function(data) {

            if (
                !data
                ||
                data.length === 0
            ) {

                alert(
                    "Location not found. "
                    +
                    "Please check spelling."
                );

                return;

            }


            var lat =
                parseFloat(
                    data[0].lat
                );


            var lon =
                parseFloat(
                    data[0].lon
                );


            searchLocationState = {

                lat: lat,
                lon: lon

            };


            var radius =
                parseFloat(
                    document.getElementById(
                        "radiusSelect"
                    ).value
                );


            map_c183b44bf7d14c48b298286fea1dd962.setView(
                [
                    lat,
                    lon
                ],
                10
            );


            // ------------------------------------------
            // REMOVE OLD SEARCH MARKER
            // ------------------------------------------

            if (
                searchMarker !== null
            ) {

                map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
                    searchMarker
                );

            }


            // ------------------------------------------
            // REMOVE OLD RADIUS CIRCLE
            // ------------------------------------------

            if (
                radiusCircle !== null
            ) {

                map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
                    radiusCircle
                );

            }


            // ------------------------------------------
            // ADD SEARCH LOCATION MARKER
            // ------------------------------------------

            searchMarker =
                L.marker(
                    [
                        lat,
                        lon
                    ],
                    {

                        icon:
                            L.divIcon({

                                className:
                                    "search-location-marker",

                                html:
                                    '<div style="font-size:28px;">📍</div>',

                                iconSize:
                                    [30, 30],

                                iconAnchor:
                                    [15, 30]

                            })

                    }
                ).addTo(
                    map_c183b44bf7d14c48b298286fea1dd962
                );


            searchMarker.bindPopup(
                "<b>"
                +
                query
                +
                "</b>"
            );


            // ------------------------------------------
            // ADD RADIUS CIRCLE
            // ------------------------------------------

            radiusCircle =
                L.circle(
                    [
                        lat,
                        lon
                    ],
                    {

                        radius:
                            radius *
                            1609.344,

                        color:
                            "#3b82f6",

                        weight:
                            1,

                        fillOpacity:
                            0.05

                    }
                ).addTo(
                    map_c183b44bf7d14c48b298286fea1dd962
                );


            // ------------------------------------------
            // APPLY FILTERS
            // ------------------------------------------

            updateMarkers();

        }
    )

    .catch(
        function(error) {

            console.error(
                error
            );

            alert(
                "Unable to search "
                +
                "for that location."
            );

        }
    );

}


// ==========================================================
// CLEAR ALL FILTERS
// ==========================================================

function clearSearch() {

    document.getElementById(
        "locationInput"
    ).value = "";


    document.getElementById(
        "frequencyInput"
    ).value = "";


    document.getElementById(
        "echoLinkSelect"
    ).value = "all";


    searchLocationState = null;

    selectedLinkedCallSign = null;

    selectedMarker = null;


    if (
        searchMarker !== null
    ) {

        map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
            searchMarker
        );

        searchMarker = null;

    }


    if (
        radiusCircle !== null
    ) {

        map_c183b44bf7d14c48b298286fea1dd962.removeLayer(
            radiusCircle
        );

        radiusCircle = null;

    }


    // Restore all bands
    document.getElementById(
        "allBand"
    ).checked = true;


    document.querySelectorAll(
        ".bandCheckbox"
    ).forEach(
        function(checkbox) {

            checkbox.checked = true;

        }
    );


    map_c183b44bf7d14c48b298286fea1dd962.setView(
        [
            40.1,
            -76.5
        ],
        8
    );


    updateMarkers();

}


// ==========================================================
// ECHOLINK FILTER CHANGE
// ==========================================================

document.getElementById(
    "echoLinkSelect"
).addEventListener(
    "change",
    function() {

        updateMarkers();

    }
);


// ==========================================================
// RADIUS CHANGE
// ==========================================================

document.getElementById(
    "radiusSelect"
).addEventListener(
    "change",
    function() {

        if (
            searchLocationState !== null
        ) {

            var radius =
                parseFloat(
                    document.getElementById(
                        "radiusSelect"
                    ).value
                );


            if (
                radiusCircle !== null
            ) {

                radiusCircle.setRadius(
                    radius *
                    1609.344
                );

            }

        }


        updateMarkers();

    }
);


// ==========================================================
// ENTER KEY - LOCATION SEARCH
// ==========================================================

document.getElementById(
    "locationInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchLocation();

        }

    }
);


// ==========================================================
// ENTER KEY - FREQUENCY SEARCH
// ==========================================================

document.getElementById(
    "frequencyInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            document.getElementById(
                "frequencyInput"
            ).blur();

        }

    }
);


// ==========================================================
// MAP ZOOM
// ==========================================================

// moveend also fires after zoom and after search / fit animations,
// so pins are always re-spread once the map has settled.
map_c183b44bf7d14c48b298286fea1dd962.on(
    "moveend",
    function() {

        updateMarkerPositions();

    }
);


map_c183b44bf7d14c48b298286fea1dd962.on(
    "zoomend",
    function() {

        updateMarkerPositions();

    }
);


// Tapping empty map clears the selected network, but the tap that
// merely dismisses an open info card does not.
var popupJustClosed = false;

map_c183b44bf7d14c48b298286fea1dd962.on(
    "popupclose",
    function() {

        popupJustClosed = true;

        setTimeout(
            function() {
                popupJustClosed = false;
            },
            0
        );

    }
);

map_c183b44bf7d14c48b298286fea1dd962.on(
    "click",
    function() {

        if (popupJustClosed) {
            return;
        }

        if (selectedLinkedCallSign !== null) {
            clearNetworkSelection();
        }

    }
);


// ==========================================================
// INITIAL UI STATE
// ==========================================================

document.getElementById(
    "filterPanel"
).style.display =
    "block";


</script>
