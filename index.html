    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css"/>

                initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <style>
                #map_7aaab35b0207e450beb3f59ab9a126e2 {
                    position: relative;
                    width: 100.0%;
                    height: 100.0%;
                    left: 0.0%;
                    top: 0.0%;
                }

            </style>

            <style>html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            </style>

            <style>#map {
                position:absolute;
                top:0;
                bottom:0;
                right:0;
                left:0;
                }
            </style>

            <script>
                L_NO_TOUCH = false;
                L_DISABLE_3D = false;
            </script>

        
</head>
<body>
    
    
<style>
#filterButton {
    position: fixed; top: 10px; left: 10px; z-index: 9999;
    background: white; border: 2px solid #888; border-radius: 5px;
    padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#filterPanel {
    position: fixed; top: 55px; left: 10px; z-index: 9998;
    background: white; padding: 14px; width: 245px; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35); font-family: Arial, sans-serif; font-size: 14px;
}
#filterPanel input[type="text"] { width: 225px; padding: 6px; margin-top: 4px; margin-bottom: 8px; box-sizing: border-box; }
#filterPanel select { width: 225px; padding: 6px; margin-top: 4px; margin-bottom: 10px; }
#filterPanel label { display: block; margin-bottom: 5px; cursor: pointer; }
.filterTitle { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
.sectionTitle { font-weight: bold; margin-top: 8px; margin-bottom: 5px; }
.filterButton { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
</style>

<button id="filterButton" onclick="toggleFilterPanel()">🔎 Find / Filter</button>

<div id="filterPanel">
    <div class="filterTitle">Find / Filter Repeaters</div>

    <div class="sectionTitle">Frequency Search</div>
    <input type="text" id="frequencyInput" placeholder="e.g. 146.520 or 443.9" oninput="updateMarkers()">

    <div class="sectionTitle">Location</div>
    <input type="text" id="locationInput" placeholder="Media, PA or Philadelphia">
    
    <div class="sectionTitle">Radius</div>
    <select id="radiusSelect">
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
        <option value="25" selected>25 miles</option>
        <option value="50">50 miles</option>
        <option value="100">100 miles</option>
    </select>
    
    <div class="sectionTitle">Bands</div>
    <label><input type="checkbox" id="allBand" checked onchange="toggleAllBands()"> All</label>
    <label><input type="checkbox" class="bandCheckbox" value="2m" checked onchange="updateBandState()"><span style="color: blue; font-weight: bold;"> ●</span> 2m</label>
    <label><input type="checkbox" class="bandCheckbox" value="70cm" checked onchange="updateBandState()"><span style="color: green; font-weight: bold;"> ●</span> 70cm</label>
    <label><input type="checkbox" class="bandCheckbox" value="GMRS" checked onchange="updateBandState()"><span style="color: red; font-weight: bold;"> ●</span> GMRS</label>
    
    <button class="filterButton" onclick="searchLocation()">Search Location</button>
    <button class="filterButton" onclick="clearSearch()">Clear Filters</button>
</div>
    
<script>
var searchMarker = null;
var radiusCircle = null;
var searchLocationState = null;
var bandColors = { "2m": "blue", "70cm": "green", "GMRS": "red" };
var repeaterData = [];
var markerLayers = [];

// Fetch JSON data dynamically on load
fetch('repeaters.json')
    .then(response => {
        if (!response.ok) throw new Error('Failed to load repeater data');
        return response.json();
    })
    .then(data => {
        repeaterData = data;
        initMarkers();
    })
    .catch(error => console.error('Error fetching JSON:', error));

function initMarkers() {
    repeaterData.forEach(repeater => {
        var color = bandColors[repeater.band] || "gray";
        
        var icon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + color + '.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var marker = L.marker([repeater.lat, repeater.lon], { icon: icon });
        marker.bindPopup(L.popup({ max_width: 350 }).setContent(repeater.popup));
        marker.addTo(map_7aaab35b0207e450beb3f59ab9a126e2);
        
        markerLayers.push({ marker: marker, repeater: repeater });
    });
    updateMarkers();
}

function toggleFilterPanel() {
    var panel = document.getElementById("filterPanel");
    var button = document.getElementById("filterButton");
    if (panel.style.display === "none") {
        panel.style.display = "block";
        button.innerHTML = "🔎 Hide Filters";
    } else {
        panel.style.display = "none";
        button.innerHTML = "🔎 Find / Filter";
    }
}

function getSelectedBands() {
    var checkboxes = document.querySelectorAll(".bandCheckbox");
    var selected = [];
    checkboxes.forEach(function(checkbox) {
        if (checkbox.checked) selected.push(checkbox.value);
    });
    return selected;
}

function toggleAllBands() {
    var allCheckbox = document.getElementById("allBand");
    document.querySelectorAll(".bandCheckbox").forEach(function(checkbox) {
        checkbox.checked = allCheckbox.checked;
    });
    updateMarkers();
}

function updateBandState() {
    var checkboxes = document.querySelectorAll(".bandCheckbox");
    var allCheckbox = document.getElementById("allBand");
    var allChecked = true;
    checkboxes.forEach(function(checkbox) {
        if (!checkbox.checked) allChecked = false;
    });
    allCheckbox.checked = allChecked;
    updateMarkers();
}

function distanceMiles(lat1, lon1, lat2, lon2) {
    var R = 3958.8;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function updateMarkers() {
    var selectedBands = getSelectedBands();
    var radius = parseFloat(document.getElementById("radiusSelect").value);
    var freqQuery = document.getElementById("frequencyInput").value.trim();

    markerLayers.forEach(function(item) {
        var visible = selectedBands.includes(item.repeater.band);

        // Filter by frequency (supports partial typing, e.g., "146.5")
        if (visible && freqQuery !== "") {
            if (!item.repeater.frequency.includes(freqQuery)) {
                visible = false;
            }
        }

        // Filter by location radius
        if (visible && searchLocationState !== null) {
            var distance = distanceMiles(
                searchLocationState.lat, searchLocationState.lon,
                item.repeater.lat, item.repeater.lon
            );
            if (distance > radius) visible = false;
        }

        if (visible) {
            item.marker.setOpacity(1);
        } else {
            item.marker.setOpacity(0);
        }
    });
}

function searchLocation() {
    var query = document.getElementById("locationInput").value.trim();
    if (!query) { alert("Enter a location first."); return; }

    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query);

    fetch(url, { headers: { "Accept": "application/json" } })
    .then(response => response.json())
    .then(function(data) {
        if (!data || data.length === 0) { alert("Location not found."); return; }
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        searchLocationState = { lat: lat, lon: lon };
        var radius = parseFloat(document.getElementById("radiusSelect").value);

        map_7aaab35b0207e450beb3f59ab9a126e2.setView([lat, lon], 10);

        if (searchMarker !== null) { map_7aaab35b0207e450beb3f59ab9a126e2.removeLayer(searchMarker); }
        if (radiusCircle !== null) { map_7aaab35b0207e450beb3f59ab9a126e2.removeLayer(radiusCircle); }

        searchMarker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: "search-location-marker",
                html: '<div style="font-size:28px;">📍</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            })
        }).addTo(map_7aaab35b0207e450beb3f59ab9a126e2);

        searchMarker.bindPopup("<b>" + query + "</b>");

        radiusCircle = L.circle([lat, lon], {
            radius: radius * 1609.344,
            color: "black", weight: 1, fillOpacity: 0.05
        }).addTo(map_7aaab35b0207e450beb3f59ab9a126e2);

        updateMarkers();
    })
    .catch(function(error) {
        console.error(error);
        alert("Unable to search for that location.");
    });
}

function clearSearch() {
    document.getElementById("locationInput").value = "";
    document.getElementById("frequencyInput").value = "";
    searchLocationState = null;
    if (searchMarker !== null) { map_7aaab35b0207e450beb3f59ab9a126e2.removeLayer(searchMarker); searchMarker = null; }
    if (radiusCircle !== null) { map_7aaab35b0207e450beb3f59ab9a126e2.removeLayer(radiusCircle); radiusCircle = null; }
    map_7aaab35b0207e450beb3f59ab9a126e2.setView([40.1, -76.5], 8);
    updateMarkers();
}

document.getElementById("radiusSelect").addEventListener("change", function() {
    if (searchLocationState !== null) {
        var radius = parseFloat(document.getElementById("radiusSelect").value);
        if (radiusCircle !== null) radiusCircle.setRadius(radius * 1609.344);
    }
    updateMarkers();
});

document.getElementById("locationInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") searchLocation();
});

document.getElementById("filterPanel").style.display = "block";
</script>

</body>
