</style>


<button

<div id="filterPanel">

    </div>

        </option>

    <button

        onclick="searchLocation()"

    <div
        class="sectionTitle"
        style="margin-top: 14px;"

        Frequency Filter
    </div>

    <input
        type="text"
        id="frequencyInput"
        placeholder="e.g. 146.520 or 443.9"
        oninput="updateMarkers()"
    >


    <div
        class="sectionTitle"
        style="margin-top: 14px;"
    >
        EchoLink
    </div>

    <select
        id="echoLinkSelect"
        onchange="updateMarkers()"
    >

        <option value="all" selected>
            All
        </option>

        <option value="yes">
            Yes
        </option>

        <option value="no">
            No
        </option>

    </select>


    <div
        class="sectionTitle"
        style="margin-top: 14px;"
    >
        Bands
    </div>


    <label>

        <input
            type="checkbox"
            id="allBand"
            checked
            onchange="toggleAllBands()"

        </span>

    </label>

        <input
            type="checkbox"

            value="2m"

        >

        <span

                font-weight: bold;

            ●
        </span>

        &nbsp;2m

    <label>

        <input
            type="checkbox"
            class="bandCheckbox"
            value="70cm"
            checked
            onchange="updateBandState()"
        >

        <span
            style="
                color: #16a34a;
                font-weight: bold;
                margin-left: 4px;
            "
        >
            ●
        </span>

        &nbsp;70cm

    </label>


    <label>

        <input
            type="checkbox"
            class="bandCheckbox"
            value="GMRS"
            checked
            onchange="updateBandState()"

        <span
            style="

        >
            ●

        &nbsp;GMRS

<script>


var searchMarker = null;

var radiusCircle = null;

var searchLocationState = null;


var bandColors = {
    "2m": "blue",
    "70cm": "green",
    "GMRS": "red"
};


var repeaterData = [];

var markerLayers = [];


// ==========================================================
// LOAD REPEATER JSON
// ==========================================================

fetch("repeaters.json")

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load repeater data"
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            repeaterData = data;

            initMarkers();

        }
    )

    .catch(
        error =>
            console.error(
                "Error fetching JSON:",
                error
            )
    );


// ==========================================================
// INITIALIZE MARKERS
// ==========================================================

function initMarkers() {

    markerLayers.forEach(
        function(item) {

            if (
                map_bb04c7792d3f65be28ae143f6eba09fe.hasLayer(
                    item.marker
                )
            ) {

                map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
                    item.marker
                );

            }

        }
    );


    markerLayers = [];


    repeaterData.forEach(
        function(repeater) {

            var color =
                bandColors[
                    repeater.band
                ]
                ||
                "gray";


            var iconUrl =
                "https://raw.githubusercontent.com/"
                +
                "pointhi/leaflet-color-markers/"
                +
                "master/img/marker-icon-2x-"
                +
                color
                +
                ".png";


            var icon;


            // ------------------------------------------------
            // LINKED REPEATER ICON
            // ------------------------------------------------

            if (
                repeater.linkedRepeater
            ) {

                icon =
                    L.divIcon({

                        className:
                            "linked-marker-icon",

                        html:
                            '<div class="linked-marker-wrap">'
                            +
                            '<img src="'
                            +
                            iconUrl
                            +
                            '" class="linked-marker-image">'
                            +
                            '</div>',

                        iconSize:
                            [25, 41],

                        iconAnchor:
                            [12, 41],

                        popupAnchor:
                            [1, -34]

                    });

            } else {

                // --------------------------------------------
                // NORMAL BAND-COLORED ICON
                // --------------------------------------------

                icon =
                    L.icon({

                        iconUrl:
                            iconUrl,

                        shadowUrl:
                            "https://cdnjs.cloudflare.com/"
                            +
                            "ajax/libs/leaflet/0.7.7/"
                            +
                            "images/marker-shadow.png",

                        iconSize:
                            [25, 41],

                        iconAnchor:
                            [12, 41],

                        popupAnchor:
                            [1, -34],

                        shadowSize:
                            [41, 41]

                    });

            }


            var marker =
                L.marker(
                    [
                        repeater.lat,
                        repeater.lon
                    ],
                    {
                        icon: icon
                    }
                );


            marker.bindPopup(
                L.popup({
                    max_width: 350
                }).setContent(
                    repeater.popup
                )
            );


            marker.addTo(
                map_bb04c7792d3f65be28ae143f6eba09fe
            );


            markerLayers.push({

                marker:
                    marker,

                repeater:
                    repeater

            });

        }
    );


    updateMarkerPositions();

    updateMarkers();

}


// ==========================================================
// SPREAD CO-LOCATED REPEATERS
// ==========================================================
//
// Repeaters with identical geocoded coordinates are separated
// into a small circle as the map is zoomed in.
//
// At very wide zoom levels they naturally converge again.
//
// ==========================================================

function updateMarkerPositions() {

    var zoom =
        map_bb04c7792d3f65be28ae143f6eba09fe.getZoom();


    // No meaningful spreading when very far out.
    //
    // Zoom 6 = no spread
    // Zoom 7.5 = half-ish spread
    // Zoom 9+ = full spread

    var spreadFactor =
        Math.max(
            0,
            Math.min(
                1,
                (zoom - 6) / 3
            )
        );


    var groups = {};


    markerLayers.forEach(
        function(item) {

            var key =
                item.repeater.lat.toFixed(7)
                +
                ","
                +
                item.repeater.lon.toFixed(7);


            if (!groups[key]) {

                groups[key] = [];

            }


            groups[key].push(
                item
            );

        }
    );


    Object.keys(groups).forEach(
        function(key) {

            var group =
                groups[key];


            // No collision to resolve.
            if (
                group.length === 1
            ) {

                group[0].marker.setLatLng(
                    [
                        group[0].repeater.lat,
                        group[0].repeater.lon
                    ]
                );

                return;

            }


            var baseLat =
                group[0].repeater.lat;

            var baseLon =
                group[0].repeater.lon;


            var centerPoint =
                map_bb04c7792d3f65be28ae143f6eba09fe.project(
                    [
                        baseLat,
                        baseLon
                    ],
                    zoom
                );


            var radius =
                32 *
                spreadFactor;


            group.forEach(
                function(item, index) {

                    var angle =
                        (
                            2 *
                            Math.PI *
                            index /
                            group.length
                        )
                        -
                        (
                            Math.PI /
                            2
                        );


                    var point =
                        L.point(

                            centerPoint.x
                            +
                            radius *
                            Math.cos(angle),

                            centerPoint.y
                            +
                            radius *
                            Math.sin(angle)

                        );


                    item.marker.setLatLng(

                        map_bb04c7792d3f65be28ae143f6eba09fe.unproject(
                            point,
                            zoom
                        )

                    );

                }
            );

        }
    );

}


// ==========================================================
// FILTER PANEL
// ==========================================================

function toggleFilterPanel() {

    var panel =
        document.getElementById(
            "filterPanel"
        );


    var button =
        document.getElementById(
            "filterButton"
        );


    if (
        panel.style.display === "none"
    ) {

        panel.style.display =
            "block";

        button.innerHTML =
            "🔎 Hide Filters";

    } else {

        panel.style.display =
            "none";

        button.innerHTML =
            "🔎 Find / Filter";

    }

}


// ==========================================================
// BAND FILTER
// ==========================================================

function getSelectedBands() {

    var selected = [];


    document.querySelectorAll(
        ".bandCheckbox"
    ).forEach(
        function(checkbox) {

            if (
                checkbox.checked
            ) {

                selected.push(
                    checkbox.value
                );

            }

        }
    );


    return selected;

}


function toggleAllBands() {

    var allCheckbox =
        document.getElementById(
            "allBand"
        );


    document.querySelectorAll(
        ".bandCheckbox"
    ).forEach(
        function(checkbox) {

            checkbox.checked =
                allCheckbox.checked;

        }
    );


    updateMarkers();

}


function updateBandState() {

    var allChecked =
        true;


    document.querySelectorAll(
        ".bandCheckbox"
    ).forEach(
        function(checkbox) {

            if (
                !checkbox.checked
            ) {

                allChecked =
                    false;

            }

        }
    );


    document.getElementById(
        "allBand"
    ).checked =
        allChecked;


    updateMarkers();

}


// ==========================================================
// DISTANCE CALCULATION
// ==========================================================

function distanceMiles(
    lat1,
    lon1,
    lat2,
    lon2
) {

    var R =
        3958.8;


    var dLat =
        (lat2 - lat1)
        *
        Math.PI
        /
        180;


    var dLon =
        (lon2 - lon1)
        *
        Math.PI
        /
        180;


    var a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );


    var c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


// ==========================================================
// UPDATE MARKERS
// ==========================================================

function updateMarkers() {

    var selectedBands =
        getSelectedBands();


    var radius =
        parseFloat(
            document.getElementById(
                "radiusSelect"
            ).value
        );


    var freqQuery =
        document.getElementById(
            "frequencyInput"
        ).value.trim();


    var echoLinkFilter =
        document.getElementById(
            "echoLinkSelect"
        ).value;


    markerLayers.forEach(
        function(item) {

            var visible =
                true;


            // ----------------------------------------------
            // BAND FILTER
            // ----------------------------------------------

            if (
                !selectedBands.includes(
                    item.repeater.band
                )
            ) {

                visible =
                    false;

            }


            // ----------------------------------------------
            // FREQUENCY FILTER
            // ----------------------------------------------

            if (
                visible
                &&
                freqQuery !== ""
            ) {

                var repeaterFreq =
                    String(
                        item.repeater.frequency
                        ||
                        ""
                    ).trim();


                if (
                    !repeaterFreq.startsWith(
                        freqQuery
                    )
                ) {

                    visible =
                        false;

                }

            }


            // ----------------------------------------------
            // ECHOLINK FILTER
            // ----------------------------------------------

            if (
                visible
                &&
                echoLinkFilter !== "all"
            ) {

                if (
                    echoLinkFilter === "yes"
                    &&
                    !item.repeater.echoLink
                ) {

                    visible =
                        false;

                }


                if (
                    echoLinkFilter === "no"
                    &&
                    item.repeater.echoLink
                ) {

                    visible =
                        false;

                }

            }


            // ----------------------------------------------
            // LOCATION / RADIUS FILTER
            // ----------------------------------------------

            if (
                visible
                &&
                searchLocationState !== null
            ) {

                var distance =
                    distanceMiles(

                        searchLocationState.lat,
                        searchLocationState.lon,

                        item.repeater.lat,
                        item.repeater.lon

                    );


                if (
                    distance > radius
                ) {

                    visible =
                        false;

                }

            }


            // ----------------------------------------------
            // ACTUALLY ADD / REMOVE MARKER
            // ----------------------------------------------

            if (visible) {

                if (
                    !map_bb04c7792d3f65be28ae143f6eba09fe.hasLayer(
                        item.marker
                    )
                ) {

                    item.marker.addTo(
                        map_bb04c7792d3f65be28ae143f6eba09fe
                    );

                }

            } else {

                if (
                    map_bb04c7792d3f65be28ae143f6eba09fe.hasLayer(
                        item.marker
                    )
                ) {

                    map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
                        item.marker
                    );

                }

            }

        }
    );

}


// ==========================================================
// LOCATION SEARCH
// ==========================================================

function searchLocation() {

    var query =
        document.getElementById(
            "locationInput"
        ).value.trim();


    if (!query) {

        alert(
            "Enter a location name first."
        );

        return;

    }


    var url =

        "https://nominatim.openstreetmap.org/search"

        +

        "?format=json"

        +

        "&limit=1"

        +

        "&q="

        +

        encodeURIComponent(
            query
        );


    fetch(
        url,
        {

            headers: {

                "Accept":
                    "application/json"

            }

        }
    )

    .then(
        response =>
            response.json()
    )

    .then(
        function(data) {

            if (
                !data
                ||
                data.length === 0
            ) {

                alert(
                    "Location not found. "
                    +
                    "Please check spelling."
                );

                return;

            }


            var lat =
                parseFloat(
                    data[0].lat
                );


            var lon =
                parseFloat(
                    data[0].lon
                );


            searchLocationState = {

                lat:
                    lat,

                lon:
                    lon

            };


            var radius =
                parseFloat(
                    document.getElementById(
                        "radiusSelect"
                    ).value
                );


            map_bb04c7792d3f65be28ae143f6eba09fe.setView(
                [
                    lat,
                    lon
                ],
                10
            );


            // ------------------------------------------
            // REMOVE OLD SEARCH MARKER
            // ------------------------------------------

            if (
                searchMarker !== null
            ) {

                map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
                    searchMarker
                );

            }


            // ------------------------------------------
            // REMOVE OLD RADIUS CIRCLE
            // ------------------------------------------

            if (
                radiusCircle !== null
            ) {

                map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
                    radiusCircle
                );

            }


            // ------------------------------------------
            // ADD SEARCH LOCATION MARKER
            // ------------------------------------------

            searchMarker =
                L.marker(
                    [
                        lat,
                        lon
                    ],
                    {

                        icon:
                            L.divIcon({

                                className:
                                    "search-location-marker",

                                html:
                                    '<div style="font-size:28px;">📍</div>',

                                iconSize:
                                    [30, 30],

                                iconAnchor:
                                    [15, 30]

                            })

                    }
                ).addTo(
                    map_bb04c7792d3f65be28ae143f6eba09fe
                );


            searchMarker.bindPopup(
                "<b>"
                +
                query
                +
                "</b>"
            );


            // ------------------------------------------
            // ADD RADIUS CIRCLE
            // ------------------------------------------

            radiusCircle =
                L.circle(
                    [
                        lat,
                        lon
                    ],
                    {

                        radius:
                            radius *
                            1609.344,

                        color:
                            "#3b82f6",

                        weight:
                            1,

                        fillOpacity:
                            0.05

                    }
                ).addTo(
                    map_bb04c7792d3f65be28ae143f6eba09fe
                );


            updateMarkerPositions();

            updateMarkers();

        }
    )

    .catch(
        function(error) {

            console.error(
                error
            );

            alert(
                "Unable to search "
                +
                "for that location."
            );

        }
    );

}


// ==========================================================
// CLEAR ALL FILTERS
// ==========================================================

function clearSearch() {

    document.getElementById(
        "locationInput"
    ).value = "";


    document.getElementById(
        "frequencyInput"
    ).value = "";


    document.getElementById(
        "echoLinkSelect"
    ).value = "all";


    searchLocationState =
        null;


    if (
        searchMarker !== null
    ) {

        map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
            searchMarker
        );

        searchMarker =
            null;

    }


    if (
        radiusCircle !== null
    ) {

        map_bb04c7792d3f65be28ae143f6eba09fe.removeLayer(
            radiusCircle
        );

        radiusCircle =
            null;

    }


    document.getElementById(
        "allBand"
    ).checked =
        true;


    document.querySelectorAll(
        ".bandCheckbox"
    ).forEach(
        function(checkbox) {

            checkbox.checked =
                true;

        }
    );


    map_bb04c7792d3f65be28ae143f6eba09fe.setView(
        [
            40.1,
            -76.5
        ],
        8
    );


    updateMarkerPositions();

    updateMarkers();

}


// ==========================================================
// RADIUS CHANGE
// ==========================================================

document.getElementById(
    "radiusSelect"
).addEventListener(
    "change",
    function() {

        if (
            searchLocationState !== null
        ) {

            var radius =
                parseFloat(
                    document.getElementById(
                        "radiusSelect"
                    ).value
                );


            if (
                radiusCircle !== null
            ) {

                radiusCircle.setRadius(
                    radius *
                    1609.344
                );

            }

        }


        updateMarkers();

    }
);


// ==========================================================
// ENTER KEY - LOCATION SEARCH
// ==========================================================

document.getElementById(
    "locationInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchLocation();

        }

    }
);


// ==========================================================
// ENTER KEY - FREQUENCY SEARCH
// ==========================================================

document.getElementById(
    "frequencyInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            document.getElementById(
                "frequencyInput"
            ).blur();

        }

    }
);


// ==========================================================
// KEEP CO-LOCATED PINS SPREAD AS THE MAP ZOOMS
// ==========================================================

map_bb04c7792d3f65be28ae143f6eba09fe.on(
    "zoomend",
    function() {

        updateMarkerPositions();

    }
);


document.getElementById(
    "filterPanel"
).style.display =
    "block";
